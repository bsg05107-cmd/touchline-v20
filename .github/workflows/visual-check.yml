name: Visual check TOUCHLINE classic

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'classic-v23.css'
      - 'classic-v23.js'
      - '.github/workflows/visual-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare browser runner
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          mkdir -p visual

      - name: Capture complete mobile flow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/touchline-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then ready=1; break; fi
            sleep .25
          done
          test "$ready" -eq 1

          cat > visual-check.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.CHROME_BIN,
            args: ['--no-sandbox', '--disable-gpu']
          });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          page.setDefaultTimeout(7000);
          page.on('console', msg => console.log('BROWSER', msg.type(), msg.text()));
          page.on('pageerror', err => console.log('PAGEERROR', err.message));
          await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'networkidle' });
          await page.evaluate(() => localStorage.clear());
          await page.reload({ waitUntil: 'networkidle' });
          await page.screenshot({ path: 'visual/01-formation.png' });

          await page.locator('.formation-card').first().click();
          await page.locator('.formation-next').click();
          await page.waitForTimeout(100);
          if (await page.locator('.ace-open').count()) await page.locator('.ace-open').evaluate(el => el.click());
          await page.locator('.ace-choice').first().waitFor({ state: 'visible' });
          await page.screenshot({ path: 'visual/02-first-star.png' });

          await page.locator('.ace-choice').first().click();
          await page.locator('.ace-confirm').click();
          await page.locator('.pitch-wrap').waitFor({ state: 'visible' });
          await page.locator('.pitch-wrap .empty-slot').first().click();
          await page.locator('.candidate-card').first().waitFor({ state: 'visible' });
          await page.screenshot({ path: 'visual/03-candidates.png' });
          await page.locator('.sheet-close').click();

          await page.evaluate(() => {
            const formations = eval('FORMATIONS');
            const players = eval('PLAYERS');
            const managers = eval('MANAGERS');
            const compatible = eval('positionCompatible');
            const isGK = eval('pIsGK');
            const f = formations.find(x => x.id === '433') || formations[0];
            const used = new Set();
            const lineup = {};
            for (const [pos] of f.slots) {
              const wantGK = pos === 'GK';
              const pool = players.filter(p => !used.has(p.id) && isGK(p) === wantGK);
              const p = pool.find(p => compatible(p, pos)) || pool[0];
              lineup[pos] = p.id;
              used.add(p.id);
            }
            const remain = players.filter(p => !used.has(p.id));
            const reserveGK = remain.find(p => isGK(p));
            const bench = [reserveGK, ...remain.filter(p => !isGK(p)).slice(0, 4)].filter(Boolean).map(p => p.id);
            const state = {
              version:22, stage:'squad', formationOptions:[f.id], formationId:f.id,
              lineup, bench, aceCandidates:[], aceIntroSeen:true, selectedAce:null,
              candidateTarget:null, candidateIds:[], selectedCandidate:null,
              managerCandidates:managers.slice(0,5).map(m=>m.id), selectedManager:null,
              managerId:null, sound:false, menu:false, swapSource:null,
              activeMatch:null, tournament:null, lastResult:null
            };
            localStorage.setItem('touchline_v22_state', JSON.stringify(state));
          });
          await page.reload({ waitUntil: 'networkidle' });

          await page.locator('.manager-open').click();
          await page.locator('.manager-card').first().waitFor({ state: 'visible' });
          await page.screenshot({ path: 'visual/04-manager.png' });
          await page.locator('.manager-card').first().click();
          await page.locator('.manager-confirm').click();
          await page.locator('.tournament-open').waitFor({ state: 'visible' });
          await page.screenshot({ path: 'visual/05-squad.png' });

          await page.locator('.tournament-open').click();
          await page.locator('.cup-shell').waitFor({ state: 'visible' });
          await page.screenshot({ path: 'visual/06-tournament.png' });
          await browser.close();
          JS

          node ./visual-check.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchline-classic-v23-visual
          path: visual/*.png
          if-no-files-found: warn
          retention-days: 7
