name: Visual proof TOUCHLINE Classic v24

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/visual-v24.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install runner
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core
          echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
          mkdir -p proof
      - name: Capture restored mobile screens
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8010 --bind 127.0.0.1 >/tmp/touchline-proof-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8010/index.html >/dev/null; then ready=1; break; fi
            sleep .2
          done
          test "$ready" -eq 1
          cat > proof.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME_BIN, args:['--no-sandbox','--disable-gpu']});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          page.setDefaultTimeout(7000);
          const domClick = async selector => {
            const locator = page.locator(selector).first();
            await locator.waitFor({state:'attached'});
            await locator.evaluate(el => el.click());
            await page.waitForTimeout(100);
          };
          try {
            await page.goto('http://127.0.0.1:8010/index.html',{waitUntil:'networkidle'});
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:'networkidle'});
            await page.screenshot({path:'proof/01-formation.png'});

            await domClick('.formation-card');
            await domClick('.formation-next');
            await page.locator('.ace-choice').first().waitFor({state:'visible'});
            await page.screenshot({path:'proof/02-first-star.png'});

            await domClick('.ace-choice');
            await domClick('.ace-confirm');
            await page.locator('.pitch-wrap').waitFor({state:'visible'});
            await domClick('.pitch-wrap .empty-slot');
            await page.locator('.candidate-card').first().waitFor({state:'visible'});
            await page.screenshot({path:'proof/03-candidates.png'});

            await page.evaluate(()=>{
              const formations=eval('FORMATIONS'), players=eval('PLAYERS'), managers=eval('MANAGERS');
              const compatible=eval('positionCompatible'), isGK=eval('pIsGK');
              const f=formations.find(x=>x.id==='433')||formations[0], used=new Set(), lineup={};
              for(const [pos] of f.slots){
                const pool=players.filter(p=>!used.has(p.id)&&isGK(p)===(pos==='GK'));
                const p=pool.find(p=>compatible(p,pos))||pool[0];
                lineup[pos]=p.id; used.add(p.id);
              }
              const remain=players.filter(p=>!used.has(p.id));
              const reserveGK=remain.find(p=>isGK(p));
              const bench=[reserveGK,...remain.filter(p=>!isGK(p)).slice(0,4)].filter(Boolean).map(p=>p.id);
              localStorage.setItem('touchline_v22_state',JSON.stringify({version:22,stage:'squad',formationOptions:[f.id],formationId:f.id,lineup,bench,aceCandidates:[],aceIntroSeen:true,selectedAce:null,candidateTarget:null,candidateIds:[],selectedCandidate:null,managerCandidates:managers.slice(0,5).map(m=>m.id),selectedManager:null,managerId:null,sound:false,menu:false,swapSource:null,activeMatch:null,tournament:null,lastResult:null}));
            });
            await page.reload({waitUntil:'networkidle'});
            await domClick('.manager-open');
            await page.locator('.manager-card').first().waitFor({state:'visible'});
            await page.screenshot({path:'proof/04-manager.png'});
            await domClick('.manager-card');
            await domClick('.manager-confirm');
            await page.locator('.tournament-open').waitFor({state:'visible'});
            await page.screenshot({path:'proof/05-squad.png'});
            await domClick('.tournament-open');
            await page.locator('.cup-shell').waitFor({state:'visible'});
            await page.screenshot({path:'proof/06-tournament.png'});
          } finally {
            await browser.close();
          }
          JS
          node proof.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchline-classic-v24-proof
          path: proof/*.png
          if-no-files-found: warn
          retention-days: 7
