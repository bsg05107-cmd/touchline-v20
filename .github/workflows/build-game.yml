name: Build TOUCHLINE legacy exact

on:
  push:
    branches: [main]
    paths:
      - 'payload/legacy18-*.txt'
      - '.github/workflows/build-game.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify old-look game
        shell: bash
        run: |
          set -euo pipefail
          cat \
            payload/legacy18-00.txt \
            payload/legacy18-01.txt \
            payload/legacy18-02.txt \
            payload/legacy18-03.txt \
            payload/legacy18-04.txt \
            payload/legacy18-05.txt \
            | tr -d '\r\n' \
            | base64 --decode \
            | gzip --decompress \
            > index.html

          echo '43de39c738e1ed4a4a8eb8e441b0e17f11562a8a848b8debfb2431209ca88985  index.html' | sha256sum --check --strict
          test "$(wc -c < index.html)" -eq 122047
          grep -q '<title>TOUCHLINE Legacy v18 — Draft Cup</title>' index.html
          grep -q 'data-touchline-version="legacy-v18-exact"' index.html
          grep -q 'touchline_legacy_v18_exact_state' index.html
          grep -q 'legacy-ace-card' index.html
          grep -q 'legacy-round-progress' index.html

      - name: Commit verified restored version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'touchline-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Verified game is already current.'
            exit 0
          fi
          git commit -m 'Restore exact pre-v20 TOUCHLINE interface'
          git push
