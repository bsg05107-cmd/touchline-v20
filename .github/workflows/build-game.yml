name: Build TOUCHLINE game

on:
  push:
    branches: [main]
    paths:
      - 'payload/v22-*.txt'
      - 'classic-v23.css'
      - 'classic-v23.js'
      - '.github/workflows/build-game.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct verified base game
        shell: bash
        run: |
          set -euo pipefail
          cat \
            payload/v22-00a.txt \
            payload/v22-00b.txt \
            payload/v22-01.txt \
            payload/v22-02.txt \
            payload/v22-03.txt \
            payload/v22-04.txt \
            payload/v22-05.txt \
            | tr -d '\r\n' \
            | base64 --decode \
            | gzip --decompress \
            > index.html

          echo '5fa2c26e1b08602b5073650086eb2deeb294fe14b2c1858747715047fdb158a6  index.html' | sha256sum --check --strict
          grep -q '<title>TOUCHLINE v22 — Draft Cup</title>' index.html
          test "$(wc -c < index.html)" -eq 107240

      - name: Apply classic early-look interface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace(
              '<title>TOUCHLINE v22 — Draft Cup</title>',
              '<title>TOUCHLINE Classic v23 — Draft Cup</title>',
              1,
          )
          html = html.replace(
              '</head>',
              '<link rel="stylesheet" href="./classic-v23.css?v=23">\n</head>',
              1,
          )
          html = html.replace(
              '</body>',
              '<script src="./classic-v23.js?v=23"></script>\n</body>',
              1,
          )
          path.write_text(html, encoding='utf-8')
          PY

          grep -q 'classic-v23.css?v=23' index.html
          grep -q 'classic-v23.js?v=23' index.html
          grep -q '<title>TOUCHLINE Classic v23 — Draft Cup</title>' index.html

      - name: Commit verified game
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'touchline-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Verified game is already current.'
            exit 0
          fi
          git commit -m 'Build TOUCHLINE Classic v23 interface'
          git push
