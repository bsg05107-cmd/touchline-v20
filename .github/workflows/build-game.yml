name: Build TOUCHLINE game

on:
  push:
    branches: [main]
    paths:
      - 'payload/**'
      - '.github/workflows/build-game.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify game
        shell: bash
        run: |
          set -euo pipefail
          cat \
            payload/part-00.txt \
            payload/part-01.txt \
            payload/part-02-03.txt \
            payload/part-04-05.txt \
            payload/part-06-07.txt \
            | tr -d '\r\n' \
            | base64 --decode \
            | gzip --decompress \
            > index.html

          echo '94399d018c47443446d1e493b8f3e6d7a4efe0156ae63555be1fe5007a7681a9  index.html' | sha256sum --check --strict
          grep -q '<title>TOUCHLINE v21 — Draft Cup</title>' index.html
          test "$(wc -c < index.html)" -eq 117193

      - name: Commit verified game
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'touchline-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Verified game is already current.'
            exit 0
          fi
          git commit -m 'Build verified TOUCHLINE v21 game'
          git push
