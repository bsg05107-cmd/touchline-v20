name: Build TOUCHLINE game

on:
  push:
    branches: [main]
    paths:
      - 'payload/v22-*.txt'
      - '.github/workflows/build-game.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify game
        shell: bash
        run: |
          set -euo pipefail
          cat \
            payload/v22-00a.txt \
            payload/v22-00b.txt \
            payload/v22-01.txt \
            payload/v22-02.txt \
            payload/v22-03.txt \
            payload/v22-04.txt \
            payload/v22-05.txt \
            | tr -d '\r\n' \
            | base64 --decode \
            | gzip --decompress \
            > index.html

          echo '5fa2c26e1b08602b5073650086eb2deeb294fe14b2c1858747715047fdb158a6  index.html' | sha256sum --check --strict
          grep -q '<title>TOUCHLINE v22 — Draft Cup</title>' index.html
          grep -q 'EARLY LOOK RESTORATION' index.html
          test "$(wc -c < index.html)" -eq 107240

      - name: Commit verified game
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'touchline-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Verified game is already current.'
            exit 0
          fi
          git commit -m 'Build verified TOUCHLINE v22 restored UI'
          git push
