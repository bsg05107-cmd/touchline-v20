<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e2321">
<title>TOUCHLINE Legacy v18 — Draft Cup</title>
<style>
:root{
  --ink:#111817;--paper:#f4f1e9;--paper-2:#ebe7dc;--paper-3:#ded8ca;--white:#fffdf8;
  --green:#0f7b5b;--green-2:#188967;--mint:#b9e8d8;--mint-soft:#e4f3ec;
  --red:#e5432e;--red-dark:#a83122;--gold:#b58735;--gold-soft:#efe0b8;
  --navy:#0e2321;--navy-2:#183531;--navy-3:#23463f;--muted:#6d746f;--line:#d5d1c7;
  --shadow:0 7px 0 rgba(17,24,23,.06);--safe-bottom:max(18px,env(safe-area-inset-bottom));
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#dad7cf;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center;min-height:100vh;overscroll-behavior:none} button{font:inherit;color:inherit} button,[role=button]{-webkit-tap-highlight-color:transparent} svg{display:block}
#app{width:min(100vw,440px);min-height:100dvh;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 45px rgba(17,24,23,.14)}
.app-shell{min-height:100dvh;position:relative;background:var(--paper);padding-bottom:94px}.app-shell.dark{background:var(--navy);color:var(--white)}
.topbar{height:58px;padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(17,24,23,.10);position:relative;z-index:20;background:rgba(244,241,233,.94);backdrop-filter:blur(12px)}
.dark .topbar{background:rgba(14,35,33,.94);border-color:rgba(255,255,255,.10)}
.brand{font-size:13px;font-weight:950;letter-spacing:.085em}.step{font-size:10px;font-weight:900;letter-spacing:.105em;color:var(--muted)}.dark .step{color:#a6b6b1}
.top-actions{display:flex;gap:7px}.icon-btn{width:34px;height:34px;border:1px solid rgba(17,24,23,.14);border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center;font-weight:900;cursor:pointer}.dark .icon-btn{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff}.icon-btn:active{transform:scale(.95)}
.view{padding:16px 16px 108px}.view.flush{padding:0 0 94px}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.15em;text-transform:uppercase;color:var(--red)}.title{font-size:29px;line-height:1.06;letter-spacing:-.052em;margin:5px 0 0;font-weight:950}.subtle{color:var(--muted);font-size:12px;line-height:1.45}.dark .subtle{color:#a8b9b4}
.bottom-bar{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:0;width:min(100vw,440px);padding:14px 16px var(--safe-bottom);background:linear-gradient(180deg,rgba(244,241,233,0),var(--paper) 30%)}.dark .bottom-bar{background:linear-gradient(180deg,rgba(14,35,33,0),var(--navy) 30%)}
.primary,.secondary{min-height:54px;width:100%;border:0;border-radius:14px;font-size:15px;font-weight:950;letter-spacing:-.02em;cursor:pointer}.primary{background:var(--red);color:white;box-shadow:0 7px 0 rgba(124,31,19,.18)}.primary:active{transform:translateY(3px);box-shadow:0 4px 0 rgba(124,31,19,.18)}.primary:disabled{background:#b9b5aa;box-shadow:none;color:#eeece6}.secondary{background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow)}
.split-actions{display:grid;grid-template-columns:1fr 1.55fr;gap:9px}

/* common team assets */
.crest{--club:#222;width:38px;height:42px;display:grid;place-items:center;clip-path:polygon(50% 0,94% 14%,88% 72%,50% 100%,12% 72%,6% 14%);background:var(--club);color:white;font-size:9px;font-weight:950;letter-spacing:-.02em;border:2px solid rgba(255,255,255,.75);filter:drop-shadow(0 3px 2px rgba(0,0,0,.13));flex:none}.crest.sm{width:25px;height:28px;font-size:7px}.crest.lg{width:48px;height:53px;font-size:11px}
.jersey{position:relative;width:72px;height:70px;filter:drop-shadow(0 7px 7px rgba(0,0,0,.16));flex:none}.jersey svg{width:100%;height:100%}.jersey.mini{width:42px;height:41px}.jersey.big{width:138px;height:134px}
.grade-legend{--grade:#b58735}.grade-world{--grade:#7a3e9d}.grade-elite{--grade:#186b75}.grade-core{--grade:#77807b}
.grade-label{font-size:9px;font-weight:950;letter-spacing:.07em;color:var(--grade)}

/* formation */
.formation-header{margin:3px 2px 16px}.formation-list{display:grid;gap:11px}.formation-card{width:100%;border:1px solid var(--line);background:var(--white);border-radius:18px;padding:13px;display:grid;grid-template-columns:112px 1fr 24px;align-items:center;gap:13px;text-align:left;box-shadow:var(--shadow);cursor:pointer;transition:.18s ease}.formation-card:active{transform:scale(.985)}.formation-card.selected{border:2px solid var(--red);padding:12px;box-shadow:0 0 0 4px rgba(229,67,46,.09),var(--shadow)}
.formation-mini{height:112px;border-radius:12px;background:#176d55;position:relative;overflow:hidden}.formation-mini:before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.48);border-radius:5px}.formation-dot{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:#f5efe2;border:2px solid rgba(17,24,23,.25);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.formation-info strong{display:block;font-size:24px;letter-spacing:-.055em}.formation-info span{display:block;margin-top:5px;font-size:11px;font-weight:800;color:var(--muted)}.formation-arrow{font-size:22px;color:#9b9e98}.formation-card.selected .formation-arrow{color:var(--red)}

/* ace */
.ace-screen{min-height:100dvh;background:var(--navy);color:white;position:relative;overflow:hidden}.ace-screen:before{content:"";position:absolute;inset:58px 0 0;background:radial-gradient(circle at 50% 38%,rgba(219,185,103,.15),transparent 31%),linear-gradient(180deg,#173a34,#0e2321 78%)}
.ace-intro-head{position:relative;padding:24px 18px 0;z-index:2}.ace-intro-head .eyebrow{color:#e9cb86}.ace-intro-head .title{font-size:31px}.ace-stage{position:relative;height:590px;display:flex;align-items:center;justify-content:center;z-index:1}.ace-rays{position:absolute;inset:30px 0 0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.07) 0 3deg,transparent 3deg 17deg);mask-image:radial-gradient(circle,black 0 40%,transparent 70%);animation:rotate 18s linear infinite}.ace-back{position:relative;width:220px;height:330px;border-radius:22px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(135deg,#16382f,#0a1c1a 55%,#1e4d42);box-shadow:0 30px 65px rgba(0,0,0,.44);overflow:hidden;cursor:pointer;animation:float 2.4s ease-in-out infinite}.ace-back:before,.ace-back:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.14);border-radius:50%}.ace-back:before{inset:26px}.ace-back:after{inset:67px}.ace-monogram{position:absolute;inset:0;display:grid;place-items:center;font-size:76px;font-weight:950;color:rgba(255,255,255,.09);letter-spacing:-.09em}.ace-slit{position:absolute;top:0;bottom:0;left:50%;width:4px;transform:translateX(-50%);background:#fff3cb;box-shadow:0 0 30px 9px rgba(255,233,165,.55);animation:pulseLight 1.4s ease-in-out infinite}.ace-tap{position:absolute;bottom:46px;left:20px;right:20px;display:flex;justify-content:space-between;font-size:11px;font-weight:850;color:#a9bbb6}.ace-tap b{color:#f0d796;letter-spacing:.1em}
.ace-choices{position:relative;padding:18px 14px 110px;z-index:2}.ace-choices-head{display:flex;align-items:end;justify-content:space-between;margin:2px 3px 14px}.ace-choices-head h1{margin:0;font-size:24px;letter-spacing:-.05em}.ace-choices-head span{font-size:10px;color:#9eb0ab;font-weight:850}
.ace-choice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.ace-choice{position:relative;border:1px solid rgba(230,204,142,.54);background:#f2ede2;color:var(--ink);border-radius:18px;padding:12px 7px 10px;min-height:380px;box-shadow:0 18px 36px rgba(0,0,0,.29);overflow:hidden;cursor:pointer;transition:.2s ease}.ace-choice:nth-child(2){transform:translateY(-9px)}.ace-choice.selected{border:3px solid #f0ce7a;padding:10px 5px 8px;box-shadow:0 0 0 4px rgba(240,206,122,.15),0 22px 44px rgba(0,0,0,.35)}.ace-choice:not(.selected){opacity:.91}.ace-choice .ace-ovr{font-size:39px;line-height:.9;font-weight:950;letter-spacing:-.08em}.ace-choice .ace-pos{font-size:9px;color:var(--red);font-weight:950;letter-spacing:.1em;margin-top:5px}.ace-choice .crest{position:absolute;right:9px;top:10px}.ace-choice .jersey{margin:26px auto 8px;width:92px;height:90px}.ace-choice .ace-name{font-size:15px;line-height:1.05;font-weight:950;text-align:center;letter-spacing:-.035em;min-height:34px}.ace-choice .ace-club{font-size:9px;color:#626862;text-align:center;font-weight:800;margin-top:5px}.ace-choice .ace-stats{margin-top:12px;border-top:1px solid #d4cec0;padding-top:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;text-align:center}.ace-choice .ace-stats b{font-size:12px}.ace-choice .ace-stats span{display:block;font-size:7px;color:#777b74;font-weight:900;margin-top:1px}
.ace-reveal-flash{position:fixed;inset:0;z-index:80;pointer-events:none;background:white;opacity:0;animation:flash .7s ease-out}

/* squad pitch */
.squad-header{padding:12px 16px 9px;display:flex;align-items:center;justify-content:space-between}.squad-title{display:flex;align-items:center;gap:9px}.squad-title strong{font-size:17px;letter-spacing:-.035em}.squad-title span{font-size:9px;color:var(--muted);font-weight:850}.squad-metrics{display:flex;gap:7px}.metric{min-width:55px;border:1px solid var(--line);border-radius:10px;padding:6px 7px;background:rgba(255,253,248,.7)}.metric span{display:block;font-size:7px;font-weight:900;color:var(--muted);letter-spacing:.08em}.metric b{display:block;font-size:16px;line-height:1.05;margin-top:2px}.metric.chem b{color:var(--green)}
.pitch-wrap{margin:0 10px;border-radius:22px;background:#176d55;position:relative;height:min(62vh,515px);min-height:430px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.17),0 9px 0 rgba(17,24,23,.08)}.pitch-wrap:before{content:"";position:absolute;inset:15px;border:1px solid rgba(255,255,255,.54);border-radius:8px}.pitch-wrap:after{content:"";position:absolute;width:86px;height:86px;border:1px solid rgba(255,255,255,.45);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.half-line{position:absolute;left:15px;right:15px;top:50%;height:1px;background:rgba(255,255,255,.45)}.penalty-box{position:absolute;left:28%;right:28%;height:52px;border:1px solid rgba(255,255,255,.45)}.penalty-box.top{top:15px;border-top:0}.penalty-box.bottom{bottom:15px;border-bottom:0}.pitch-links{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible}.pitch-links line{stroke-linecap:round;transition:.25s ease}.pitch-slot{position:absolute;z-index:4;width:62px;transform:translate(-50%,-50%);text-align:center;touch-action:none}.slot-empty{width:52px;height:52px;border-radius:50%;border:2px dashed rgba(255,255,255,.68);background:rgba(4,50,38,.22);color:white;display:grid;place-items:center;margin:auto;font-size:11px;font-weight:950;box-shadow:0 3px 0 rgba(0,0,0,.10);cursor:pointer}.slot-empty.hot{animation:slotPulse 1.2s ease-in-out infinite}.slot-empty small{display:block;font-size:8px}.pitch-player{width:62px;cursor:grab;user-select:none}.pitch-player.dragging{opacity:.25}.pitch-token{width:51px;height:51px;border-radius:50%;background:#f3eee2;margin:auto;display:grid;place-items:center;position:relative;border:3px solid var(--grade);box-shadow:0 4px 0 rgba(0,0,0,.16)}.pitch-token .jersey{width:39px;height:38px}.pitch-token .num{position:absolute;left:-5px;top:-6px;width:25px;height:25px;border-radius:50%;background:var(--grade);color:white;display:grid;place-items:center;font-size:10px;font-weight:950;border:2px solid #f7f1e5}.pitch-name{margin-top:3px;display:inline-block;max-width:62px;padding:3px 5px;border-radius:5px;background:rgba(9,34,29,.82);color:white;font-size:8px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pitch-player.penalty .pitch-token:after{content:"-30%";position:absolute;right:-9px;bottom:-5px;padding:2px 4px;border-radius:4px;background:var(--red);color:white;font-size:7px;font-weight:950}.drop-valid .slot-empty,.drop-valid .pitch-token{box-shadow:0 0 0 5px rgba(185,232,216,.38),0 4px 0 rgba(0,0,0,.16)}.drop-invalid{filter:grayscale(.7);opacity:.5}
.bench{margin:13px 10px 0;padding:10px;border:1px solid var(--line);background:var(--white);border-radius:16px;box-shadow:var(--shadow)}.bench-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.bench-head strong{font-size:11px;letter-spacing:.06em}.bench-head span{font-size:9px;color:var(--muted);font-weight:800}.bench-row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.bench-slot{height:82px;border:1px dashed #c9c4ba;border-radius:10px;display:flex;align-items:center;justify-content:center;min-width:0}.bench-slot .slot-empty{width:42px;height:42px;color:#6e756f;border-color:#bab7af;background:#eeeae0}.bench-player{width:100%;text-align:center;touch-action:none;cursor:grab}.bench-player .pitch-token{width:42px;height:42px}.bench-player .pitch-token .jersey{width:32px;height:31px}.bench-player .pitch-name{max-width:56px;color:var(--ink);background:transparent;font-size:7px;margin-top:2px;padding:0}.bench-player .num{font-size:8px;width:21px;height:21px}.drag-ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);opacity:.94}

/* candidate sheet */
.sheet-backdrop{position:fixed;z-index:60;inset:0;background:rgba(8,18,16,.54);backdrop-filter:blur(3px);animation:fadeIn .18s ease}.candidate-sheet{position:absolute;left:0;right:0;bottom:0;max-height:93dvh;background:var(--paper);border-radius:24px 24px 0 0;overflow:auto;padding:10px 14px calc(20px + env(safe-area-inset-bottom));animation:sheetUp .24s cubic-bezier(.22,.82,.35,1)}.sheet-handle{width:38px;height:4px;border-radius:99px;background:#bcb8ae;margin:0 auto 9px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sheet-head h2{margin:0;font-size:19px;letter-spacing:-.04em}.sheet-head .target{font-size:10px;color:var(--muted);font-weight:900}.sheet-close{width:32px;height:32px;border:0;border-radius:50%;background:#e6e1d7;font-size:17px}
.preview-pitch{height:134px;border-radius:16px;background:#176d55;position:relative;overflow:hidden;margin-bottom:12px}.preview-pitch:before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.48);border-radius:6px}.preview-svg{position:absolute;inset:0;width:100%;height:100%}.preview-node{position:absolute;width:40px;transform:translate(-50%,-50%);text-align:center;color:white;font-size:7px;font-weight:900}.preview-bubble{width:34px;height:34px;margin:auto;border-radius:50%;background:#efe9dc;color:var(--ink);display:grid;place-items:center;border:3px solid var(--link,#d3d0c7);font-size:10px;font-weight:950;box-shadow:0 2px 0 rgba(0,0,0,.13)}.preview-node.target .preview-bubble{background:rgba(8,57,43,.4);color:white;border:2px dashed rgba(255,255,255,.75)}
.candidate-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.candidate-card{position:relative;min-height:178px;padding:11px 10px 10px;border-radius:15px;background:var(--white);border:1px solid var(--line);box-shadow:0 4px 0 rgba(26,35,32,.05);overflow:hidden;cursor:pointer;transition:.16s ease}.candidate-card:nth-child(5){grid-column:1/-1;min-height:120px;display:grid;grid-template-columns:68px 1fr 70px;align-items:center;gap:8px}.candidate-card.chem-1{border:1.5px solid #89cbb3;box-shadow:0 0 0 2px rgba(63,164,127,.08),0 4px 0 rgba(26,35,32,.05)}.candidate-card.chem-2{border:2px solid #4fad8a;box-shadow:0 0 0 3px rgba(45,154,117,.10),0 5px 0 rgba(26,35,32,.06)}.candidate-card.chem-3{border:3px solid #0f8b64;padding:9px 8px 8px;box-shadow:0 0 0 5px rgba(15,139,100,.13),0 7px 0 rgba(26,35,32,.07)}.candidate-card.selected{outline:3px solid var(--red);outline-offset:-3px}.candidate-card.selected:after{content:"✓";position:absolute;right:7px;bottom:7px;width:23px;height:23px;border-radius:50%;background:var(--red);color:white;display:grid;place-items:center;font-size:12px;font-weight:950}.chem-pill{position:absolute;top:8px;right:8px;padding:4px 7px;border-radius:999px;background:#edeae2;color:#686f69;font-size:10px;font-weight:950}.chem-1 .chem-pill{background:#e6f4ee;color:#197353}.chem-2 .chem-pill{background:#d9efe6;color:#0d684a}.chem-3 .chem-pill{background:#0f8b64;color:white}.cand-top{display:flex;align-items:flex-start;justify-content:space-between;padding-right:43px}.cand-ovr{font-size:28px;line-height:.9;font-weight:950;letter-spacing:-.07em;color:var(--grade)}.cand-pos{font-size:8px;font-weight:950;letter-spacing:.09em;color:var(--red);margin-top:5px}.cand-main{height:68px;display:flex;align-items:center;gap:5px}.cand-main .jersey{width:58px;height:56px}.cand-name{font-size:13px;line-height:1.05;font-weight:950;letter-spacing:-.035em;word-break:keep-all}.cand-club{font-size:9px;color:#666c66;font-weight:800;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cand-links{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}.link-chip{padding:3px 5px;border-radius:5px;background:#efede6;color:#666b66;font-size:8px;font-weight:850}.link-chip.on{background:#dff3e9;color:#0b6a4a}.chem-bar{height:4px;background:#dedbd2;border-radius:99px;overflow:hidden;margin-top:8px}.chem-bar span{display:block;height:100%;width:var(--w);background:#18a778;border-radius:99px}.wide-info{min-width:0}.wide-chem{text-align:right}.wide-chem b{display:block;font-size:23px;color:var(--green)}.wide-chem span{font-size:8px;color:var(--muted);font-weight:850}.sheet-action{position:sticky;bottom:-20px;padding-top:13px;background:linear-gradient(180deg,rgba(244,241,233,0),var(--paper) 24%)}

/* manager */
.manager-summary{margin:12px 0 14px;padding:12px 13px;border-radius:14px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between}.manager-summary span{display:block;font-size:9px;color:#9fb2ad;font-weight:850}.manager-summary strong{display:block;font-size:15px;margin-top:2px}.manager-list{display:grid;gap:9px}.manager-card{position:relative;display:grid;grid-template-columns:48px 1fr 68px;gap:9px;align-items:center;padding:12px;border-radius:15px;background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer}.manager-card.best{border:3px solid var(--green);padding:10px;box-shadow:0 0 0 4px rgba(15,123,91,.10),var(--shadow)}.manager-card.selected{outline:3px solid var(--red);outline-offset:-3px}.manager-avatar{width:46px;height:54px;border-radius:12px;background:linear-gradient(145deg,#d5cec0,#f5f0e7);position:relative;overflow:hidden}.manager-avatar:before{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#c8a990;left:13px;top:7px}.manager-avatar:after{content:"";position:absolute;width:38px;height:34px;border-radius:18px 18px 5px 5px;background:#263c38;left:4px;top:27px}.manager-name{font-size:13px;font-weight:950;letter-spacing:-.025em}.manager-team{display:flex;align-items:center;gap:6px;margin-top:6px}.manager-team span{font-size:9px;color:#626862;font-weight:800;line-height:1.2}.manager-style{margin-top:6px;font-size:9px;color:#7a7e78;font-weight:760}.manager-effect{text-align:right}.manager-effect b{display:block;font-size:23px;color:var(--green)}.manager-effect span{font-size:8px;color:var(--muted);font-weight:850}.manager-tag{display:inline-block;margin-top:5px;padding:3px 5px;border-radius:5px;background:#dff3e9;color:#0b6849;font-size:7px;font-weight:900}

/* match */
.match-screen{min-height:100dvh;background:var(--navy);color:white;position:relative;padding-bottom:100px}.match-head{padding:18px 16px 11px;display:flex;justify-content:space-between;align-items:center}.match-head span{font-size:10px;color:#9db0ab;font-weight:850;letter-spacing:.08em}.match-clock{font-size:24px;font-weight:950}.scoreboard{margin:10px 16px 0;padding:24px 16px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:#142e2a}.teams-score{display:grid;grid-template-columns:1fr 82px 1fr;align-items:center;text-align:center}.score-team{display:flex;flex-direction:column;align-items:center;gap:8px}.score-team strong{font-size:12px}.score{font-size:54px;font-weight:950;letter-spacing:-.07em}.match-power{margin-top:18px;display:flex;justify-content:center;gap:8px}.match-power span{padding:5px 8px;border:1px solid rgba(255,255,255,.12);border-radius:7px;font-size:8px;color:#adc0ba;font-weight:850}.goal-feed{margin:16px;padding:0}.goal-item{display:grid;grid-template-columns:40px 1fr auto;align-items:center;padding:12px 3px;border-bottom:1px solid rgba(255,255,255,.09);animation:goalIn .35s ease}.goal-minute{font-size:12px;color:#e8cd88;font-weight:950}.goal-player{font-size:13px;font-weight:900}.goal-side{font-size:9px;color:#9fb1ac;font-weight:850}.match-empty{text-align:center;color:#8fa39d;font-size:11px;padding:35px 0}.result-banner{margin:14px 16px;padding:13px;border-radius:12px;background:#f2ede2;color:var(--ink);text-align:center;font-weight:950;font-size:18px}

const POSITION_BASE = {LST:'ST',RST:'ST',LCF:'CF',RCF:'CF',LAM:'CAM',RAM:'CAM',LCM:'CM',RCM:'CM',LCDM:'CDM',RCDM:'CDM',LCB:'CB',RCB:'CB'};
const POSITION_GROUPS = [ ['ST','CF'],['LW','LM','LWB'],['RW','RM','RWB'],['CAM','CM','CDM'],['LB','LWB'],['RB','RWB'],['CB'] ];
function basePos(pos){return POSITION_BASE[pos]||pos;}
function positionCompatible(player,pos){return player.positions.includes(basePos(pos));}
function samePositionFamily(player,pos){const p=basePos(pos); return POSITION_GROUPS.some(g=>g.includes(p)&&player.positions.some(x=>g.includes(x)));}
function effectiveOvr(player,pos){if((pIsGK(player)) !== (basePos(pos)==='GK')) return null; if(positionCompatible(player,pos)) return player.ovr; if(samePositionFamily(player,pos)) return Math.round(player.ovr*.88); return Math.round(player.ovr*.70);}
function pIsGK(p){return p.positions.includes('GK');}
function gradeFor(ovr){return ovr>=90?'legend':ovr>=87?'world':ovr>=84?'elite':'core';}
function gradeLabel(ovr){return ovr>=90?'전설':ovr>=87?'월드클래스':ovr>=84?'엘리트':'코어';}
function clubOf(id){return CLUBS[id];}
function playerById(id){return PLAYERS.find(p=>p.id===id);}
function managerById(id){return MANAGERS.find(m=>m.id===id);}
function formationById(id){return FORMATIONS.find(f=>f.id===id);}

function initAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(audioCtx?.state==='suspended')audioCtx.resume();}
function tone(freq=440,dur=.07,type='sine',gain=.035,delay=0){if(!state.sound)return;initAudio();if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime+delay);g.gain.setValueAtTime(.0001,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+delay+.008);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+delay+dur);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+dur+.02);}
function sfx(type){if(!state.sound)return; if(type==='tap')tone(320,.045,'square',.018); if(type==='select'){tone(420,.06,'triangle',.025);tone(620,.08,'triangle',.018,.04);} if(type==='reveal'){tone(180,.18,'sawtooth',.035);tone(360,.18,'triangle',.03,.09);tone(720,.26,'sine',.035,.18);} if(type==='sign'){tone(520,.08,'triangle',.03);tone(780,.12,'triangle',.026,.07);} if(type==='goal'){tone(440,.09,'square',.035);tone(660,.13,'square',.028,.06);tone(880,.17,'triangle',.025,.13);} if(type==='final'){tone(260,.12,'triangle',.025);tone(390,.14,'triangle',.025,.1);tone(520,.2,'sine',.03,.2);} if(type==='error')tone(130,.12,'sawtooth',.025);}

function availableAceCandidates(){const f=formationById(state.formationId);const desired=uniq(f.slots.map(s=>basePos(s[0])));const pool=PLAYERS.filter(p=>p.ovr>=86&&p.positions.some(x=>desired.includes(x)));const result=[];const usedClubs=new Set();const add=p=>{if(!p||result.some(x=>x.id===p.id)||usedClubs.has(p.club))return false;result.push(p);usedClubs.add(p.club);return true;};const elites=shuffle(pool.filter(p=>p.ovr>=89));add(elites[0]);if(Math.random()<.38){add(shuffle(pool.filter(p=>pIsGK(p)))[0]);}const rolePools=shuffle([pool.filter(p=>p.positions.some(x=>['ST','CF','LW','RW'].includes(x))),pool.filter(p=>p.positions.some(x=>['CAM','CM','CDM','LM','RM'].includes(x))),pool.filter(p=>pIsGK(p)||p.positions.some(x=>['CB','LB','RB','LWB','RWB'].includes(x)))]);for(const bucket of rolePools){if(result.length>=3)break;add(shuffle(bucket)[0]);}for(const p of shuffle(pool)){if(result.length>=3)break;add(p);}return result.slice(0,3).map(p=>p.id);}

function currentFormation(){return formationById(state.formationId);}
function ensureLineup(){const f=currentFormation();if(!f)return;for(const [pos] of f.slots)if(!(pos in state.lineup))state.lineup[pos]=null;}
function occupiedIds(){return [...Object.values(state.lineup),...state.bench].filter(Boolean);}
function playerAtSlot(pos){const id=state.lineup[pos];return id?playerById(id):null;}
function linksForFormation(f=currentFormation()){
 const nodes=f.slots.map(([pos,x,y])=>({pos,x,y}));const edges=new Set();
 function add(a,b){if(a===b)return;const k=[a,b].sort().join('|');edges.add(k);}
 // horizontal neighbors per rough row
 const rows=[];for(const n of nodes){let row=rows.find(r=>Math.abs(r.y-n.y)<10);if(!row){row=[];rows.push(row);}row.push(n);}for(const r of rows){r.sort((a,b)=>a.x-b.x);for(let i=0;i<r.length-1;i++)add(r[i].pos,r[i+1].pos);}
 // nearest node above and below, favor vertical progression
 for(const n of nodes){const above=nodes.filter(m=>m.y<n.y-8).sort((a,b)=>Math.hypot(a.x-n.x,(a.y-n.y)*.8)-Math.hypot(b.x-n.x,(b.y-n.y)*.8));const below=nodes.filter(m=>m.y>n.y+8).sort((a,b)=>Math.hypot(a.x-n.x,(a.y-n.y)*.8)-Math.hypot(b.x-n.x,(b.y-n.y)*.8));if(above[0])add(n.pos,above[0].pos);if(below[0])add(n.pos,below[0].pos);}
 return [...edges].map(k=>k.split('|'));
}
function linkStrength(a,b){if(!a||!b)return 0;const ca=clubOf(a.club),cb=clubOf(b.club);if(a.club===b.club)return 3;if(ca.league===cb.league&&a.nation===b.nation)return 2.4;if(ca.league===cb.league)return 1.45;if(a.nation===b.nation)return 1.15;return 0;}
function chemSnapshot(lineup=state.lineup){const f=currentFormation();if(!f)return {total:0,personal:{},edges:[]};const edges=linksForFormation(f).map(([a,b])=>{const pa=lineup[a]?playerById(lineup[a]):null,pb=lineup[b]?playerById(lineup[b]):null;return {a,b,strength:linkStrength(pa,pb)};});const personal={};for(const [pos] of f.slots){const relevant=edges.filter(e=>e.a===pos||e.b===pos);const raw=relevant.reduce((s,e)=>s+e.strength,0);personal[pos]=raw>=5?3:raw>=2.5?2:raw>=1?1:0;}return {total:Object.values(personal).reduce((a,b)=>a+b,0),personal,edges};}
function managerBonus(managerId=state.managerId,lineup=state.lineup){if(!managerId)return 0;const m=managerById(managerId),mc=clubOf(m.club);let score=0;for(const id of Object.values(lineup)){if(!id)continue;const p=playerById(id),c=clubOf(p.club);if(p.club===m.club)score+=1.25;else if(c.league===mc.league)score+=.28;if(p.nation===m.nation)score+=.22;}return Math.min(5,Math.round(score));}
function teamChem(){return chemSnapshot().total+managerBonus();}
function teamAverage(){const f=currentFormation();if(!f)return 0;const vals=f.slots.map(([pos])=>{const p=playerAtSlot(pos);return p?effectiveOvr(p,pos):null;}).filter(v=>v!=null);return vals.length?Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10:0;}
function teamPower(){return teamAverage()+chemSnapshot().total*.13+managerBonus()*.22;}
function lineColor(s){return s>=2.8?'#b9e8d8':s>=1.3?'#efd17b':s>0?'rgba(255,255,255,.45)':'rgba(255,255,255,.16)';}

function renderPitch({interactive=true,compact=false}={}){const f=currentFormation();const snap=chemSnapshot();const lines=snap.edges.map(e=>{const a=f.slots.find(s=>s[0]===e.a),b=f.slots.find(s=>s[0]===e.b);return `<line x1="${a[1]}" y1="${a[2]}" x2="${b[1]}" y2="${b[2]}" stroke="${lineColor(e.strength)}" stroke-width="${e.strength>=2.8?1.05:e.strength>=1.3?.72:.42}" opacity="${e.strength?1:.58}"/>`;}).join('');const slots=f.slots.map(([pos,x,y])=>{const p=playerAtSlot(pos);if(!p)return `<div class="pitch-slot drop-target" data-target-type="lineup" data-slot="${pos}" style="left:${x}%;top:${y/1.4}%"><button class="slot-empty ${interactive?'empty-slot':''} ${state.candidateTarget?.slot===pos?'hot':''}" data-slot="${pos}"><b>＋</b><small>${pos}</small></button></div>`;const eff=effectiveOvr(p,pos),pen=eff<p.ovr;return `<div class="pitch-slot drop-target" data-target-type="lineup" data-slot="${pos}" style="left:${x}%;top:${y/1.4}%"><div class="pitch-player draggable-player ${gradeClass(p.ovr)} ${pen?'penalty':''}" data-source-type="lineup" data-slot="${pos}"><div class="pitch-kit"><span class="pitch-ovr">${eff}</span>${jerseyHtml(p.club,'mini')}<small>${pos}</small></div><span class="pitch-name">${escapeHtml(baseName(p.name))}</span></div></div>`;}).join('');return `<div class="pitch-wrap ${compact?'compact':''}"><div class="pitch-outline"></div><div class="half-line"></div><div class="center-circle"></div><div class="penalty-box top"></div><div class="penalty-box bottom"></div><svg class="pitch-links" viewBox="0 0 100 140" preserveAspectRatio="none">${lines}</svg>${slots}</div>`;}

function renderBench(){return `<div class="bench"><div class="bench-head"><strong>벤치 <b>${state.bench.filter(Boolean)}/5</b></strong><span>선발 ↔ 벤치 · 드래그로 교체</span></div><div class="bench-row">${state.bench.map((id,i)=>{if(!id)return `<div class="bench-slot drop-target" data-target-type="bench" data-bench="${i}"><button class="bench-empty empty-bench" data-bench="${i}">＋</button></div>`;const p=playerById(id);return `<div class="bench-slot drop-target" data-target-type="bench" data-bench="${i}"><div class="bench-player draggable-player ${gradeClass(p.ovr)}" data-source-type="bench" data-bench="${i}"><div class="bench-kit"><span>${p.ovr}</span>${jerseyHtml(p.club,'mini')}</div><small>${escapeHtml(baseName(p.name))}</small></div></div>`;}).join('')}</div></div>`;}

function renderSquadScreen(final=false){ensureLineup();const full=startersFull(),bfull=benchFull();let action;if(!full)action=`<button class="primary" disabled>빈 자리를 눌러 선수를 영입하세요</button>`;else if(!bfull)action=`<button class="primary" disabled>벤치 ${state.bench.filter(Boolean).length} / 5</button>`;else if(!state.managerId)action=`<button class="primary manager-open">감독 선택&nbsp;&nbsp;→</button>`;else action=`<div class="split-actions"><button class="secondary quick-match">빠른 경기</button><button class="primary tournament-open">8초 경기 시작&nbsp;&nbsp;→</button></div>`;const count=Object.values(state.lineup).filter(Boolean).length+state.bench.filter(Boolean).length;return shell(`<div class="squad-overview"><div class="squad-title-row"><div><strong>${currentFormation().name}</strong><span>${final?'경기 준비':'선수 영입'}</span></div><b>${count}<small>/16</small></b></div>${metricHtml()}<div class="squad-progress"><span style="width:${Math.min(100,count/16*100)}%"></span></div><p>${full?(bfull?'선발을 바꾸거나 경기를 시작하세요.':'벤치 자리를 눌러 후보를 영입하세요.'):'빈 자리를 누르면 후보가 열려요.'}</p></div>${renderPitch({interactive:true})}${renderBench()}${state.managerId?`<div class="manager-strip"><span style="--club:${clubOf(managerById(state.managerId).club).crest}"></span><b>${escapeHtml(managerById(state.managerId).name)}</b><small>감독 케미 +${managerBonus()}</small></div>`:''}${bottomBar(action)}`,{flush:true,step:''});}
function generateCandidates(target){const used=new Set(occupiedIds());const isLine=target.type==='lineup';const pos=isLine?basePos(target.slot):null;let pool=PLAYERS.filter(p=>!used.has(p.id));if(isLine){const wantGK=pos==='GK';pool=pool.filter(p=>pIsGK(p)===wantGK);const exact=shuffle(pool.filter(p=>positionCompatible(p,pos))).slice(0,3);const family=shuffle(pool.filter(p=>!exact.includes(p)&&samePositionFamily(p,pos))).slice(0,1);const wildcard=shuffle(pool.filter(p=>!exact.includes(p)&&!family.includes(p))).slice(0,1);let result=[...exact,...family,...wildcard];if(result.length<5)result=[...result,...shuffle(pool.filter(p=>!result.includes(p))).slice(0,5-result.length)];return shuffle(result).map(p=>p.id);}else{
 const needGK=!state.bench.some(id=>id&&pIsGK(playerById(id)));let result=[];if(needGK&&target.bench===0)result.push(...shuffle(pool.filter(p=>pIsGK(p))).slice(0,1));result.push(...shuffle(pool.filter(p=>!pIsGK(p)&&p.ovr>=82)).slice(0,5-result.length));return result.map(p=>p.id);
 }}
function candidateProjection(p,target){const before=chemSnapshot().total;if(target.type!=='lineup')return {delta:0,total:before,club:0,league:0,nation:0,links:[]};const temp={...state.lineup,[target.slot]:p.id};const after=chemSnapshot(temp);const f=currentFormation();const edges=after.edges.filter(e=>e.a===target.slot||e.b===target.slot);let club=0,league=0,nation=0;for(const e of edges){const otherPos=e.a===target.slot?e.b:e.a;const oid=temp[otherPos];if(!oid)continue;const o=playerById(oid);if(o.club===p.club)club++;if(clubOf(o.club).league===clubOf(p.club).league)league++;if(o.nation===p.nation)nation++;}return {delta:after.total-before,total:after.total,club,league,nation,links:edges};}

function renderPreviewPitch(target,candidate){if(target.type!=='lineup')return '';
 const f=currentFormation(),temp={...state.lineup};if(candidate)temp[target.slot]=candidate.id;const snap=chemSnapshot(temp);const slot=f.slots.find(s=>s[0]===target.slot);const neighborEdges=snap.edges.filter(e=>e.a===target.slot||e.b===target.slot);const lines=neighborEdges.map(e=>{const other=e.a===target.slot?e.b:e.a,o=f.slots.find(s=>s[0]===other);return `<line x1="${slot[1]}" y1="${slot[2]}" x2="${o[1]}" y2="${o[2]}" stroke="${lineColor(e.strength)}" stroke-width="${e.strength>=2.8?2:e.strength>=1.3?1.4:.8}"/>`;}).join('');const nodes=neighborEdges.map(e=>e.a===target.slot?e.b:e.a).filter(p=>temp[p]).map(pos=>{const s=f.slots.find(x=>x[0]===pos),p=playerById(temp[pos]),edge=neighborEdges.find(e=>e.a===pos||e.b===pos);return `<div class="preview-node" style="left:${s[1]}%;top:${s[2]/1.4}%"><div class="preview-bubble" style="--link:${lineColor(edge.strength)}">${p.ovr}</div>${escapeHtml(baseName(p.name))}</div>`;}).join('');return `<div class="preview-pitch"><svg class="preview-svg" viewBox="0 0 100 140" preserveAspectRatio="none">${lines}</svg>${nodes}<div class="preview-node target" style="left:${slot[1]}%;top:${slot[2]/1.4}%"><div class="preview-bubble">${candidate?candidate.ovr:'+'}</div>${target.slot}</div></div>`;}

function legacyNationCode(n){return ({'프랑스':'FRA','브라질':'BRA','잉글랜드':'ENG','스페인':'ESP','우루과이':'URU','독일':'GER','벨기에':'BEL','노르웨이':'NOR','포르투갈':'POR','네덜란드':'NED','이탈리아':'ITA','아르헨티나':'ARG','한국':'KOR','크로아티아':'CRO','스위스':'SUI','튀르키예':'TUR','덴마크':'DEN','모로코':'MAR','세르비아':'SRB','나이지리아':'NGA','조지아':'GEO','콜롬비아':'COL','스웨덴':'SWE','오스트리아':'AUT','미국':'USA','에콰도르':'ECU','슬로바키아':'SVK','카메룬':'CMR','캐나다':'CAN','일본':'JPN','가나':'GHA','폴란드':'POL','이집트':'EGY','헝가리':'HUN','스코틀랜드':'SCO','세네갈':'SEN','슬로베니아':'SVN','기니':'GUI','핀란드':'FIN','체코':'CZE','멕시코':'MEX','루마니아':'ROU'})[n]||String(n).slice(0,3).toUpperCase();}
function candidateCard(p,target,maxDelta,index){const proj=candidateProjection(p,target),delta=proj.delta;let intensity=0;if(target.type==='lineup'){if(delta===maxDelta&&delta>0)intensity=3;else if(delta>=2)intensity=2;else if(delta>0)intensity=1;}const sel=state.selectedCandidate===p.id;const eff=target.type==='lineup'?effectiveOvr(p,target.slot):p.ovr;const club=clubOf(p.club);return `<button class="candidate-card ${gradeClass(p.ovr)} chem-${intensity} ${sel?'selected':''}" data-candidate="${p.id}"><div class="candidate-visual"><div class="candidate-meta"><div><b>${eff}</b><small>${gradeLabel(p.ovr)}</small></div><span>${legacyNationCode(p.nation)}<small>${target.type==='lineup'?`케미 +${Math.max(0,delta)}`:'벤치'}</small></span></div>${jerseyHtml(p.club)}${sel?'<i class="candidate-check">✓</i>':''}</div><div class="candidate-foot"><strong>${escapeHtml(baseName(p.name))}</strong><span><i style="--club:${club.crest}"></i>${escapeHtml(club.short)}</span></div></button>`;}
function legacyCandidateStats(p){return legacySixStats(p).map(([k,v])=>`<span><b>${v}</b><small>${k}</small></span>`).join('');}

function renderCandidateSheet(){const target=state.candidateTarget;if(!target)return '';const selected=state.selectedCandidate?playerById(state.selectedCandidate):null;const projs=state.candidateIds.map(id=>candidateProjection(playerById(id),target));const maxDelta=Math.max(0,...projs.map(x=>x.delta));const cards=state.candidateIds.map((id,i)=>candidateCard(playerById(id),target,maxDelta,i)).join('');const label=target.type==='lineup'?`${target.slot} 영입`:`벤치 선수 영입`;const delta=selected?candidateProjection(selected,target).delta:0;return `<div class="sheet-backdrop"><section class="candidate-sheet"><div class="sheet-handle"></div><div class="sheet-head"><h2>${label}</h2><span>5명 중 선택</span><button class="sheet-close">×</button></div><div class="candidate-grid">${cards}</div>${selected?`<div class="candidate-detail"><div><strong>${escapeHtml(selected.name)}</strong><span>${escapeHtml(clubOf(selected.club).short)} · ${flag(selected.nation)} ${escapeHtml(selected.nation)}</span></div><b>케미 +${Math.max(0,delta)}</b></div><div class="candidate-stats">${legacyCandidateStats(selected)}</div>`:`<div class="candidate-placeholder">후보를 누르면 능력치와 케미를 비교할 수 있어요.</div>`}<div class="sheet-action"><button class="reroll-btn" aria-label="다시 뽑기">↶ <small>3</small></button><button class="primary candidate-confirm" ${selected?'':'disabled'}>＋&nbsp;&nbsp;영입 확정</button></div></section></div>`;}
function confirmCandidate(){const id=state.selectedCandidate,t=state.candidateTarget;if(!id||!t)return;if(t.type==='lineup')state.lineup[t.slot]=id;else state.bench[t.bench]=id;state.candidateTarget=null;state.candidateIds=[];state.selectedCandidate=null;sfx('sign');save();render();}

function managerChem(m){const mc=clubOf(m.club);let club=0,league=0,nation=0;for(const id of Object.values(state.lineup)){if(!id)continue;const p=playerById(id),c=clubOf(p.club);if(p.club===m.club)club++;if(c.league===mc.league)league++;if(p.nation===m.nation)nation++;}const score=Math.min(5,Math.round(club*1.2+league*.23+nation*.2));return {score,club,league,nation};}
function openManager(){const ranked=MANAGERS.map(m=>({m,...managerChem(m)})).sort((a,b)=>b.score-a.score);const top=ranked.slice(0,2).map(x=>x.m),rest=sample(ranked.slice(2).map(x=>x.m),3);state.managerCandidates=shuffle([...top,...rest]).map(m=>m.id);state.selectedManager=state.managerCandidates[0];state.stage='manager';save();render();}

function renderManager(){const infos=state.managerCandidates.map(id=>{const m=managerById(id),ch=managerChem(m);return {m,ch};});const best=Math.max(...infos.map(x=>x.ch.score));const cards=infos.map(({m,ch},i)=>{const c=clubOf(m.club),sel=state.selectedManager===m.id;return `<button class="legacy-manager-card ${ch.score===best?'best':''} ${sel?'selected':''}" data-manager="${m.id}"><div class="manager-club" style="--club:${c.crest};--kit:${c.colors[0]}">${crestHtml(m.club,'sm')}<span>${escapeHtml(m.club)}</span></div><div class="manager-copy"><strong>${escapeHtml(m.name)}</strong><span>${escapeHtml(c.name)} · ${flag(m.nation)}</span><small>${escapeHtml(m.style)}</small></div><div class="manager-chem"><b>+${ch.score}</b><small>케미</small></div>${sel?'<i>✓</i>':''}</button>`;}).join('');return shell(`${legacySteps(4)}<div class="manager-page-head"><h1>감독 선택</h1><span>팀과 국적 연결을 확인하세요.</span></div><div class="manager-score"><span>현재 스쿼드</span><b>OVR ${teamAverage()} · 케미 ${chemSnapshot().total}</b></div><div class="manager-list">${cards}</div>${bottomBar(`<button class="primary manager-confirm" ${state.selectedManager?'':'disabled'}>이 감독으로 완성&nbsp;&nbsp;→</button>`)}`,{step:''});}
function confirmManager(){if(!state.selectedManager)return;state.managerId=state.selectedManager;state.stage='squad';sfx('sign');save();render();}

function sourcePlayer(src){if(src.type==='lineup')return playerAtSlot(src.slot);const id=state.bench[src.bench];return id?playerById(id):null;}
function targetAccepts(player,target){if(!player)return false;if(target.type==='bench')return true;return pIsGK(player)===(basePos(target.slot)==='GK');}
function getTargetPlayer(target){if(target.type==='lineup')return playerAtSlot(target.slot);const id=state.bench[target.bench];return id?playerById(id):null;}
function setTarget(target,id){if(target.type==='lineup')state.lineup[target.slot]=id;else state.bench[target.bench]=id;}
function swap(source,target){const a=sourcePlayer(source),b=getTargetPlayer(target);if(!a)return false;if(!targetAccepts(a,target)|| (b&&!targetAccepts(b,source))){sfx('error');toast('골키퍼와 필드 선수는 바꿀 수 없어');return false;}setTarget(target,a.id);setTarget(source,b?b.id:null);sfx('select');save();render();return true;}
let drag=null;
function startDrag(e,el){const src=el.dataset.sourceType==='lineup'?{type:'lineup',slot:el.dataset.slot}:{type:'bench',bench:+el.dataset.bench};const p=sourcePlayer(src);if(!p)return;e.preventDefault();initAudio();const ghost=el.cloneNode(true);ghost.classList.add('drag-ghost');document.body.appendChild(ghost);el.classList.add('dragging');drag={src,el,ghost,moved:false,startX:e.clientX,startY:e.clientY};moveGhost(e.clientX,e.clientY);document.addEventListener('pointermove',onDragMove,{passive:false});document.addEventListener('pointerup',onDragEnd,{once:true});highlightTargets(p);}
function moveGhost(x,y){if(drag)Object.assign(drag.ghost.style,{left:x+'px',top:y+'px'});}
function highlightTargets(p){$$('.drop-target').forEach(el=>{const t=el.dataset.targetType==='lineup'?{type:'lineup',slot:el.dataset.slot}:{type:'bench',bench:+el.dataset.bench};el.classList.add(targetAccepts(p,t)?'drop-valid':'drop-invalid');});}
function clearHighlights(){$$('.drop-target').forEach(el=>el.classList.remove('drop-valid','drop-invalid'));}
function onDragMove(e){if(!drag)return;e.preventDefault();moveGhost(e.clientX,e.clientY);if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>8)drag.moved=true;}
function onDragEnd(e){document.removeEventListener('pointermove',onDragMove);if(!drag)return;const {src,el,ghost,moved}=drag;ghost.remove();el.classList.remove('dragging');clearHighlights();drag=null;if(!moved){const prev=state.swapSource;if(prev&&!(prev.type===src.type&&prev.slot===src.slot&&prev.bench===src.bench)){state.swapSource=null;swap(prev,src);}else{state.swapSource=src;toast('끌어서 교체하거나 바꿀 선수를 눌러줘');}return;}state.swapSource=null;const targetEl=document.elementFromPoint(e.clientX,e.clientY)?.closest('.drop-target');if(!targetEl)return;const target=targetEl.dataset.targetType==='lineup'?{type:'lineup',slot:targetEl.dataset.slot}:{type:'bench',bench:+targetEl.dataset.bench};if(src.type===target.type&&src.slot===target.slot&&src.bench===target.bench)return;swap(src,target);}
function handleTapSwap(target){if(!state.swapSource)return false;const src=state.swapSource;state.swapSource=null;if(src.type===target.type&&src.slot===target.slot&&src.bench===target.bench)return true;swap(src,target);return true;}

function rosterForTeam(team){if(team.id==='USER')return Object.values(state.lineup).filter(Boolean).map(playerById);return PLAYERS.filter(p=>p.club===team.id);}
function scorerFor(team){const roster=rosterForTeam(team).filter(p=>!pIsGK(p));if(!roster.length)return team.name;const weighted=[];for(const p of roster){const w=Math.max(1,Math.round((p.stats.shooting-55)/5)+(p.positions.some(x=>['ST','LW','RW','CF','CAM'].includes(x))?5:1));for(let i=0;i<w;i++)weighted.push(p);}return weighted[Math.floor(Math.random()*weighted.length)]?.name||team.name;}
function poisson(lambda){let L=Math.exp(-lambda),k=0,p=1;do{k++;p*=Math.random();}while(p>L&&k<9);return k-1;}
function simTeamFromClub(id){const c=clubOf(id);return {id,name:c.name,short:c.short,rating:c.rating};}
function userTeam(){return {id:'USER',name:'MY XI',short:'MY XI',rating:teamPower()};}
function simulateMatch(home,away,knockout=false){const diff=home.rating-away.rating;const xh=clampN(1.35+diff*.055,.38,3.25),xa=clampN(1.18-diff*.05,.32,3.05);let hs=poisson(xh),as=poisson(xa);hs=Math.min(hs,6);as=Math.min(as,6);const events=[];for(let i=0;i<hs;i++)events.push({minute:Math.floor(5+Math.random()*84),side:'home',scorer:scorerFor(home)});for(let i=0;i<as;i++)events.push({minute:Math.floor(5+Math.random()*84),side:'away',scorer:scorerFor(away)});events.sort((a,b)=>a.minute-b.minute);let pens=null,winner=null;if(knockout&&hs===as){let hp=3+Math.floor(Math.random()*3),ap=3+Math.floor(Math.random()*3);if(hp===ap)(Math.random()<.5?hp++:ap++);pens={home:hp,away:ap};winner=hp>ap?'home':'away';}else winner=hs>as?'home':as>hs?'away':null;return {home,away,homeScore:hs,awayScore:as,events,pens,winner};}
function startQuickMatch(){const ids=Object.keys(CLUBS);const close=ids.map(id=>simTeamFromClub(id)).sort((a,b)=>Math.abs(a.rating-userTeam().rating)-Math.abs(b.rating-userTeam().rating)).slice(0,7);const away=close[Math.floor(Math.random()*close.length)];state.activeMatch={mode:'quick',result:simulateMatch(userTeam(),away,false),finished:false,revealed:0,displayHome:0,displayAway:0,clock:0};state.stage='match';save();render();}
function clearPlayback(){playbackTimers.forEach(clearTimeout);playbackTimers=[];}
function startPlayback(){clearPlayback();const m=state.activeMatch;if(!m||m.finished)return;const dur=7600;const clockEl=$('.match-clock');let start=performance.now();const tick=()=>{if(!state.activeMatch||state.activeMatch.finished)return;const pct=Math.min(1,(performance.now()-start)/dur);state.activeMatch.clock=Math.round(pct*90);if(clockEl)clockEl.textContent=`${state.activeMatch.clock}'`;if(pct<1)playbackTimers.push(setTimeout(tick,120));};tick();m.result.events.forEach((ev,i)=>{playbackTimers.push(setTimeout(()=>revealGoal(i),Math.max(350,ev.minute/90*dur)));});playbackTimers.push(setTimeout(finishPlayback,dur+120));}
function revealGoal(index){const m=state.activeMatch;if(!m||m.finished||index<m.revealed)return;const ev=m.result.events[index];m.revealed=index+1;if(ev.side==='home')m.displayHome++;else m.displayAway++;sfx('goal');updateMatchDom();}
function updateMatchDom(){const m=state.activeMatch;if(!m)return;const hs=$('.score-home'),as=$('.score-away'),feed=$('.goal-feed');if(hs)hs.textContent=m.displayHome;if(as)as.textContent=m.displayAway;if(feed){const visible=m.result.events.slice(0,m.revealed);feed.innerHTML=visible.length?visible.map(ev=>`<div class="goal-item"><span class="goal-minute">${ev.minute}'</span><span class="goal-player">${escapeHtml(ev.scorer)}</span><span class="goal-side">${ev.side==='home'?escapeHtml(m.result.home.short):escapeHtml(m.result.away.short)}</span></div>`).join(''):`<div class="match-empty">경기 진행 중</div>`;}}
function finishPlayback(){const m=state.activeMatch;if(!m)return;m.finished=true;m.revealed=m.result.events.length;m.displayHome=m.result.homeScore;m.displayAway=m.result.awayScore;m.clock=90;sfx('final');save();render();}
function skipPlayback(){clearPlayback();finishPlayback();}
function renderMatch(){const m=state.activeMatch,r=m.result;const done=m.finished;const resultText=done?(r.homeScore===r.awayScore?(r.pens?`${r.pens.home}-${r.pens.away} 승부차기`:'무승부'):(r.homeScore>r.awayScore?'승리':'패배')):'';return `<main class="match-screen">${topbar(m.mode==='tournament'?state.tournament.rounds[state.tournament.currentRound].name:'QUICK MATCH',true)}<div class="match-head"><span>90 MIN SIMULATION</span><div class="match-clock">${m.clock||0}'</div></div><div class="scoreboard"><div class="teams-score"><div class="score-team">${r.home.id==='USER'?crestHtml('TL','lg'):crestHtml(r.home.id,'lg')}<strong>${escapeHtml(r.home.short)}</strong></div><div class="score"><span class="score-home">${m.displayHome||0}</span><span style="font-size:25px;color:#7f918c">:</span><span class="score-away">${m.displayAway||0}</span></div><div class="score-team">${crestHtml(r.away.id,'lg')}<strong>${escapeHtml(r.away.short)}</strong></div></div><div class="match-power"><span>내 OVR ${teamAverage()}</span><span>케미 ${teamChem()}</span><span>상대 ${Math.round(r.away.rating)}</span></div></div>${done?`<div class="result-banner">${resultText}${r.pens?` · PK ${r.pens.home}-${r.pens.away}`:''}</div>`:''}<div class="goal-feed">${m.revealed?r.events.slice(0,m.revealed).map(ev=>`<div class="goal-item"><span class="goal-minute">${ev.minute}'</span><span class="goal-player">${escapeHtml(ev.scorer)}</span><span class="goal-side">${ev.side==='home'?escapeHtml(r.home.short):escapeHtml(r.away.short)}</span></div>`).join(''):`<div class="match-empty">경기 진행 중</div>`}</div>${bottomBar(done?`<button class="primary match-continue">계속</button>`:`<button class="secondary match-skip">결과 바로 보기</button>`,true)}</main>`;}

function newTournament(){const teams=shuffle(Object.keys(CLUBS)).slice(0,15).map(simTeamFromClub);teams.push(userTeam());const shuffled=shuffle(teams);const matches=[];for(let i=0;i<16;i+=2)matches.push({home:shuffled[i],away:shuffled[i+1],result:null,winner:null,user:shuffled[i].id==='USER'||shuffled[i+1].id==='USER'});state.tournament={rounds:[{name:'16강',matches},{name:'8강',matches:[]},{name:'4강',matches:[]},{name:'결승',matches:[]}],currentRound:0,ended:false,champion:null};simulateOtherMatches();state.stage='tournament';save();render();}
function simulateOtherMatches(){const t=state.tournament,round=t.rounds[t.currentRound];for(const m of round.matches){if(m.user||m.result)continue;m.result=simulateMatch(m.home,m.away,true);m.winner=m.result.winner==='home'?m.home:m.away;}}
function userMatchRecord(){return state.tournament?.rounds[state.tournament.currentRound]?.matches.find(m=>m.user&&!m.result)||null;}
function startTournamentMatch(){const rec=userMatchRecord();if(!rec)return;state.activeMatch={mode:'tournament',result:simulateMatch(rec.home,rec.away,true),finished:false,revealed:0,displayHome:0,displayAway:0,clock:0};state.stage='match';save();render();}
function processTournamentMatch(){const t=state.tournament,round=t.rounds[t.currentRound],rec=round.matches.find(m=>m.user&&!m.result);if(!rec)return;rec.result=state.activeMatch.result;rec.winner=rec.result.winner==='home'?rec.home:rec.away;const userWon=rec.winner.id==='USER';state.activeMatch=null;if(!userWon){finishTournamentFromLoss();return;}if(t.currentRound===3){t.ended=true;t.champion=userTeam();state.stage='tournament';save();render();return;}const winners=round.matches.map(m=>m.winner);const next=[];for(let i=0;i<winners.length;i+=2){const home=winners[i],away=winners[i+1];next.push({home,away,result:null,winner:null,user:home.id==='USER'||away.id==='USER'});}t.currentRound++;t.rounds[t.currentRound].matches=next;simulateOtherMatches();state.stage='tournament';save();render();}
function finishTournamentFromLoss(){const t=state.tournament;for(let ri=t.currentRound;ri<3;ri++){const round=t.rounds[ri];for(const m of round.matches){if(!m.result){m.result=simulateMatch(m.home,m.away,true);m.winner=m.result.winner==='home'?m.home:m.away;}}const winners=round.matches.map(m=>m.winner);const next=[];for(let i=0;i<winners.length;i+=2)next.push({home:winners[i],away:winners[i+1],result:null,winner:null,user:false});t.rounds[ri+1].matches=next;}const final=t.rounds[3];for(const m of final.matches){if(!m.result){m.result=simulateMatch(m.home,m.away,true);m.winner=m.result.winner==='home'?m.home:m.away;}}t.ended=true;t.champion=final.matches[0].winner;state.stage='tournament';save();render();}
function matchScore(m){if(!m.result)return '–';const r=m.result;return `${r.homeScore}-${r.awayScore}${r.pens?` (${r.pens.home}-${r.pens.away})`:''}`;}

function legacyRoundProgress(t){return `<div class="legacy-round-progress">${t.rounds.map((r,i)=>`<span class="${i<t.currentRound?'done':''} ${i===t.currentRound?'active':''}"><b>${i<t.currentRound?'✓':i+1}</b><em>${r.name}</em><small>${i<t.currentRound?'승리':i===t.currentRound?'경기 대기':'진출 대기'}</small></span>`).join('')}</div>`;}
function renderTournament(){const t=state.tournament;if(!t)return '';const round=t.rounds[t.currentRound],userRec=round.matches.find(m=>m.user),opp=userRec?(userRec.home.id==='USER'?userRec.away:userRec.home):null;if(t.ended){const champ=t.champion;return `<main class="cup-shell">${topbar('',false)}<section class="cup-page"><div class="cup-title"><div><h1>유럽 클럽 토너먼트</h1><p>16팀 단판 승부 · 동점이면 바로 승부차기</p></div><b>RUN 02</b></div>${legacyRoundProgress(t)}<div class="legacy-champion">${champ.id==='USER'?crestHtml('TL','lg'):crestHtml(champ.id,'lg')}<span>대회 종료</span><h2>${champ.id==='USER'?'우리 팀 우승':escapeHtml(champ.name)}</h2></div><div class="bracket-title"><h2>대진표</h2><span>16팀 · 4라운드</span></div>${renderBracket()}</section><div class="cup-actions"><button class="secondary squad-return">스쿼드</button><button class="primary tournament-retry">다시 도전</button></div></main>`;}return `<main class="cup-shell">${topbar('',false)}<section class="cup-page"><div class="cup-title"><div><h1>유럽 클럽 토너먼트</h1><p>16팀 단판 승부 · 동점이면 바로 승부차기</p></div><b>RUN 02</b></div>${legacyRoundProgress(t)}${userRec?`<div class="legacy-next-match"><div class="next-label"><b>${round.name} · 다음 경기</b><span>${t.currentRound+2}승이면 우승</span></div><div class="next-fixture"><div>${userRec.home.id==='USER'?crestHtml('TL','lg'):crestHtml(userRec.home.id,'lg')}<b>${escapeHtml(userRec.home.id==='USER'?'우리 팀':userRec.home.short)}</b><small>평균 ${userRec.home.id==='USER'?teamAverage():Math.round(userRec.home.rating)} · 케미 ${userRec.home.id==='USER'?teamChem():'33'}</small></div><strong>VS</strong><div>${userRec.away.id==='USER'?crestHtml('TL','lg'):crestHtml(userRec.away.id,'lg')}<b>${escapeHtml(userRec.away.id==='USER'?'우리 팀':userRec.away.short)}</b><small>평균 ${userRec.away.id==='USER'?teamAverage():Math.round(userRec.away.rating)} · 케미 ${userRec.away.id==='USER'?teamChem():'33'}</small></div></div><div class="next-foot"><span>선발 교체는 경기 시작 전까지</span><b>상대 선발&nbsp;&nbsp;→</b></div></div>`:''}<div class="bracket-title"><h2>대진표</h2><span>16팀 · 4라운드</span></div><div class="bracket-tabs">${t.rounds.map((r,i)=>`<span class="${i===t.currentRound?'active':''}">${r.name}</span>`).join('')}</div>${renderBracket()}</section>${bottomBar(`<div class="split-actions"><button class="secondary squad-return">▧&nbsp;&nbsp;선발 조정</button><button class="primary tournament-match">${round.name} 경기 시작&nbsp;&nbsp;→</button></div>`)}</main>`;}

function renderBracket(){const t=state.tournament,round=t.rounds[t.currentRound];if(!round||!round.matches.length)return '<div class="empty-bracket">대진 준비 중</div>';return `<div class="legacy-bracket">${round.matches.map((m,i)=>{const homeWin=m.winner?.id===m.home.id,awayWin=m.winner?.id===m.away.id;return `<div class="legacy-match ${m.user?'mine':''}"><div class="match-no"><span>${String(i+1).padStart(2,'0')}</span><b>${m.user?'내 다음 경기':m.result?'경기 종료':'경기 대기'}</b></div><div class="match-teams"><div class="${homeWin?'winner':m.result?'loser':''}">${m.home.id==='USER'?crestHtml('TL','sm'):crestHtml(m.home.id,'sm')}<span>${escapeHtml(m.home.id==='USER'?'내 팀':m.home.short)}</span><b>${m.result?m.result.homeScore:'—'}</b></div><div class="${awayWin?'winner':m.result?'loser':''}">${m.away.id==='USER'?crestHtml('TL','sm'):crestHtml(m.away.id,'sm')}<span>${escapeHtml(m.away.id==='USER'?'내 팀':m.away.short)}</span><b>${m.result?m.result.awayScore:'—'}</b></div></div></div>`;}).join('')}</div>`;}
function renderMenu(){if(!state.menu)return '';return `<div class="modal-backdrop"><div class="modal"><h2>메뉴</h2><p>TOUCHLINE Legacy v18 · 현재 드래프트는 자동 저장돼.</p><div class="menu-list"><button class="menu-sound">${state.sound?'사운드 끄기':'사운드 켜기'}</button><button class="menu-new">새 드래프트</button><button class="menu-close">닫기</button></div></div></div>`;}
function render(){clearPlayback();let html='';if(state.stage==='formation')html=renderFormation();else if(state.stage==='aceIntro')html=renderAceIntro();else if(state.stage==='aceChoice')html=renderAceChoice();else if(state.stage==='draft')html=renderSquadScreen(false);else if(state.stage==='manager')html=renderManager();else if(state.stage==='squad')html=renderSquadScreen(true);else if(state.stage==='match')html=renderMatch();else if(state.stage==='tournament')html=renderTournament();app.innerHTML=html+renderCandidateSheet()+renderMenu();bindEvents();if(state.stage==='match'&&!state.activeMatch.finished)startPlayback();}

function chooseFormation(id){state.formationId=id;state.lineup={};ensureLineup();save();render();}
function beginAce(){if(!state.formationId)return;state.aceCandidates=availableAceCandidates();state.selectedAce=null;state.aceIntroSeen=true;state.stage='aceChoice';save();sfx('reveal');render();}
function revealAce(){state.aceIntroSeen=true;state.stage='aceChoice';sfx('reveal');save();render();}
function confirmAce(){const p=playerById(state.selectedAce);if(!p)return;const f=currentFormation();let slot=f.slots.find(([pos])=>positionCompatible(p,pos)&&!state.lineup[pos]);if(!slot)slot=f.slots.find(([pos])=>basePos(pos)!=='GK'&&!state.lineup[pos]);state.lineup[slot[0]]=p.id;state.stage='draft';sfx('sign');save();render();}
function resetGame(){localStorage.removeItem(STORE_KEY);state=freshState();sfx('tap');render();}

function bindEvents(){
 $('.sound-toggle')?.addEventListener('click',()=>{state.sound=!state.sound;save();if(state.sound)sfx('select');render();});$$('.menu-open').forEach(el=>el.addEventListener('click',()=>{state.menu=true;render();}));$('.menu-close')?.addEventListener('click',()=>{state.menu=false;render();});$('.menu-sound')?.addEventListener('click',()=>{state.sound=!state.sound;save();render();});$('.menu-new')?.addEventListener('click',()=>{state.menu=false;resetGame();});
 $$('.formation-card').forEach(el=>el.addEventListener('click',()=>{sfx('tap');chooseFormation(el.dataset.formation);}));$('.formation-next')?.addEventListener('click',beginAce);$('.ace-open')?.addEventListener('click',revealAce);$$('.legacy-ace-card').forEach(el=>el.addEventListener('click',()=>{state.selectedAce=el.dataset.ace;sfx('select');save();render();}));$('.ace-confirm')?.addEventListener('click',confirmAce);
 $$('.empty-slot').forEach(el=>el.addEventListener('click',()=>{const target={type:'lineup',slot:el.dataset.slot};if(handleTapSwap(target))return;openCandidates(target);}));$$('.empty-bench').forEach(el=>el.addEventListener('click',()=>{const target={type:'bench',bench:+el.dataset.bench};if(handleTapSwap(target))return;if(!startersFull()){toast('먼저 선발을 완성해줘');return;}openCandidates(target);}));
 $$('.draggable-player').forEach(el=>el.addEventListener('pointerdown',e=>startDrag(e,el)));
 $('.sheet-close')?.addEventListener('click',closeCandidates);$('.sheet-backdrop')?.addEventListener('click',e=>{if(e.target.classList.contains('sheet-backdrop'))closeCandidates();});$$('.candidate-card').forEach(el=>el.addEventListener('click',()=>{state.selectedCandidate=el.dataset.candidate;sfx('select');save();render();}));$('.reroll-btn')?.addEventListener('click',()=>{if(!state.candidateTarget)return;state.candidateIds=generateCandidates(state.candidateTarget);state.selectedCandidate=null;sfx('tap');save();render();});$('.candidate-confirm')?.addEventListener('click',confirmCandidate);
 $('.manager-open')?.addEventListener('click',openManager);$$('.legacy-manager-card').forEach(el=>el.addEventListener('click',()=>{state.selectedManager=el.dataset.manager;sfx('select');save();render();}));$('.manager-confirm')?.addEventListener('click',confirmManager);
 $('.quick-match')?.addEventListener('click',startQuickMatch);$('.tournament-open')?.addEventListener('click',newTournament);$('.match-skip')?.addEventListener('click',skipPlayback);$('.match-continue')?.addEventListener('click',()=>{if(state.activeMatch.mode==='tournament')processTournamentMatch();else{state.lastResult=state.activeMatch.result;state.activeMatch=null;state.stage='squad';save();render();}});
 $('.tournament-match')?.addEventListener('click',startTournamentMatch);$('.squad-return')?.addEventListener('click',()=>{state.stage='squad';save();render();});$('.tournament-retry')?.addEventListener('click',newTournament);
}

// Automated balance runner for repeatable tuning.
function autoDraft(){const st=freshState();state=st;state.formationId=sample(FORMATIONS,1)[0].id;state.lineup={};ensureLineup();const f=currentFormation();const ace=PLAYERS.filter(p=>p.ovr>=87&&!pIsGK(p)&&f.slots.some(([pos])=>positionCompatible(p,pos))).sort((a,b)=>b.ovr-a.ovr)[Math.floor(Math.random()*6)];let slot=f.slots.find(([pos])=>positionCompatible(ace,pos)&&basePos(pos)!=='GK');state.lineup[slot[0]]=ace.id;for(const [pos] of f.slots){if(state.lineup[pos])continue;const pool=PLAYERS.filter(p=>!occupiedIds().includes(p.id)&&pIsGK(p)===(basePos(pos)==='GK'));const candidates=sample(pool.filter(p=>positionCompatible(p,pos)),4);const fallback=sample(pool.filter(p=>!candidates.includes(p)),1);const options=[...candidates,...fallback];let best=options[0];let bestScore=-999;for(const p of options){const proj=candidateProjection(p,{type:'lineup',slot:pos});const score=effectiveOvr(p,pos)+proj.delta*1.7+Math.random()*2;if(score>bestScore){bestScore=score;best=p;}}state.lineup[pos]=best.id;}state.managerId=MANAGERS.map(m=>({m,s:managerChem(m).score})).sort((a,b)=>b.s-a.s)[0].m.id;return {ovr:teamAverage(),chem:teamChem(),power:teamPower()};}
function runBalance(count=1000){const original=JSON.parse(JSON.stringify(state));const results=[],wins={};for(let i=0;i<count;i++){const d=autoDraft();results.push(d);const teams=shuffle(Object.keys(CLUBS)).slice(0,15).map(simTeamFromClub);let alive=userTeam(),round=0;while(round<4&&alive.id==='USER'){const opp=teams.splice(Math.floor(Math.random()*teams.length),1)[0];const r=simulateMatch(alive,opp,true);alive=r.winner==='home'?alive:opp;round++;}const champ=alive.id==='USER'?'MY XI':alive.short;wins[champ]=(wins[champ]||0)+1;}state=original;save();render();const avg=k=>results.reduce((s,x)=>s+x[k],0)/results.length;return {count,averageOvr:+avg('ovr').toFixed(2),averageChem:+avg('chem').toFixed(2),averagePower:+avg('power').toFixed(2),champions:Object.entries(wins).sort((a,b)=>b[1]-a[1]).slice(0,10)};}
window.TouchlineDebug={runBalance,reset:resetGame,state:()=>state};

ensureLineup();render();
})();

</script>
