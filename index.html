<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e2321">
  <title>TOUCHLINE v20</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0e2321;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif}
    body{display:grid;place-items:center;min-height:100dvh;color:#fff}
    .loader{width:min(84vw,330px);text-align:center}
    .mark{width:72px;height:72px;margin:0 auto 22px;border:1px solid rgba(255,255,255,.15);border-radius:50%;display:grid;place-items:center;background:#173a34;box-shadow:0 18px 40px rgba(0,0,0,.25);font-size:33px;animation:float 1.5s ease-in-out infinite}
    h1{margin:0;font-size:24px;letter-spacing:.09em;font-weight:950}
    p{margin:9px 0 20px;color:#a9bbb6;font-size:12px;font-weight:750}
    .track{height:4px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
    .bar{display:block;width:4%;height:100%;border-radius:inherit;background:#e5432e;transition:width .25s ease}
    .error{margin-top:18px;color:#ffd5ce;font-size:12px;line-height:1.55}
    button{margin-top:14px;min-width:130px;height:44px;border:0;border-radius:12px;background:#e5432e;color:#fff;font:inherit;font-weight:900;cursor:pointer}
    @keyframes float{50%{transform:translateY(-7px)}}
    @media(prefers-reduced-motion:reduce){.mark{animation:none}}
  </style>
</head>
<body>
  <main class="loader">
    <div class="mark" aria-hidden="true">⚽</div>
    <h1>TOUCHLINE</h1>
    <p id="status">게임 불러오는 중</p>
    <div class="track" aria-hidden="true"><i id="bar" class="bar"></i></div>
    <div id="error" class="error" role="alert"></div>
  </main>
  <script>
    const PAYLOAD_COMMIT='41566d473d8552f24b9b3b40d532f29c7f42d69d';
    const BASE=`https://raw.githubusercontent.com/bsg05107-cmd/touchline-v20/${PAYLOAD_COMMIT}/payload/`;
    const files=['part-00.txt','part-01.txt','part-02-03.txt','part-04-05.txt','part-06-07.txt'];

    async function gunzip(bytes){
      if('DecompressionStream' in window){
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        return await new Response(stream).text();
      }
      const mod=await import('https://cdn.jsdelivr.net/npm/fflate@0.8.2/+esm');
      return mod.strFromU8(mod.gunzipSync(bytes));
    }

    async function boot(){
      const status=document.getElementById('status');
      const bar=document.getElementById('bar');
      const error=document.getElementById('error');
      error.innerHTML='';
      try{
        const parts=[];
        for(let i=0;i<files.length;i++){
          status.textContent=`게임 불러오는 중 ${i+1}/${files.length}`;
          const response=await fetch(BASE+files[i],{cache:'no-store'});
          if(!response.ok) throw new Error(`파일을 불러오지 못했습니다 (${response.status})`);
          parts.push((await response.text()).trim());
          bar.style.width=`${12+((i+1)/files.length)*68}%`;
        }
        status.textContent='경기장 준비 중';
        const binary=atob(parts.join(''));
        const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
        const html=await gunzip(bytes);
        if(!html.startsWith('<!doctype html>')) throw new Error('게임 파일 검증에 실패했습니다.');
        bar.style.width='100%';
        status.textContent='킥오프';
        document.open();
        document.write(html);
        document.close();
      }catch(err){
        console.error(err);
        status.textContent='불러오지 못했습니다';
        error.innerHTML=`${String(err.message||err)}<br><button type="button" onclick="location.reload()">다시 시도</button>`;
        bar.style.width='0';
      }
    }
    boot();
  </script>
</body>
</html>
